<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>서울사대부고 역사관</title>
  <meta name="description" content="서울대학교 사범대학 부설고등학교(서울사대부고) 역사관 — 자랑스러운 부고인 · 사대부고사(신문 아카이브)">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
    * { margin: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body { font-family: "Pretendard", -apple-system, BlinkMacSystemFont, sans-serif; }
    .splash {
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; min-height: 100dvh;
      background: #0a2a5e url("img/home-main.jpg") center / cover no-repeat;
      text-decoration: none; color: #fff; text-align: center;
      position: relative; cursor: pointer; overflow: hidden;
    }
    .splash::before {
      content: ""; position: absolute; inset: 0;
      background: linear-gradient(180deg, rgba(6,20,55,.45), rgba(6,20,55,.04) 34%, rgba(0,0,0,.4));
    }
    .splash-inner { position: relative; z-index: 1; padding: 24px; animation: fadeup .9s ease both; }
    .splash .eyebrow { font-size: clamp(.8rem,2.2vw,1rem); letter-spacing: .14em; font-weight: 600; opacity: .95; text-shadow: 0 1px 8px rgba(0,0,0,.45); }
    .splash h1 { font-size: clamp(3rem,11vw,6.5rem); font-weight: 800; letter-spacing: .06em; margin: .12em 0 .2em; text-shadow: 0 2px 20px rgba(0,0,0,.5); }
    .splash .sub { font-size: clamp(.85rem,2.4vw,1.1rem); opacity: .92; text-shadow: 0 1px 10px rgba(0,0,0,.5); margin-bottom: 28px; }
    .splash .enter { display: inline-block; border: 1.5px solid rgba(255,255,255,.85); border-radius: 999px; padding: 11px 28px; font-weight: 700; font-size: 1rem; transition: background .2s, color .2s; animation: bob 2.6s ease-in-out infinite; }
    .splash:hover .enter, .splash:focus-visible .enter { background: #fff; color: #12305f; }
    @keyframes fadeup { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
    @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
    @media (max-width: 640px) { .splash { background-position: 40% center; } }
  </style>
</head>
<body>
  <a class="splash" href="home.html" aria-label="서울사대부고 역사관 들어가기">
    <div class="splash-inner">
      <p class="eyebrow">서울대학교 사범대학 부설고등학교</p>
      <h1>역사관</h1>
      <p class="sub">옛 신문과 기록 속에 남은 우리 학교와 동문의 발자취</p>
      <span class="enter">들어가기 →</span>
    </div>
  </a>
</body>
</html>
